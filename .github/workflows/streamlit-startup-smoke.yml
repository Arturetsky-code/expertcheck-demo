name: Streamlit startup smoke

on:
  push:
    branches:
      - codex/expertcheck-25.2-coverage-breakthrough
    paths:
      - app.py
      - requirements.txt
      - .streamlit/**
      - studio/**
      - core/**
      - core20/**
      - .github/workflows/streamlit-startup-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Prepare smoke secrets
        shell: bash
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          DATABASE_URL = ""
          GROQ_API_KEY = "smoke-only"
          GEMINI_API_KEY = "smoke-only"
          EOF

      - name: Start Streamlit and check health
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/expertcheck-streamlit.log
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            --server.address 127.0.0.1 \
            >"$LOG" 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ok=0
          for attempt in $(seq 1 45); do
            if ! kill -0 "$PID" >/dev/null 2>&1; then
              echo "Streamlit process exited before becoming healthy."
              cat "$LOG"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health >/tmp/health.txt 2>/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Streamlit health endpoint did not become ready."
            cat "$LOG"
            exit 1
          fi

          echo "Health:"
          cat /tmp/health.txt
          echo
          echo "Startup log:"
          cat "$LOG"
