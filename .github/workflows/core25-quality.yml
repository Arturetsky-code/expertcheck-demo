name: Core25 Quality Leap gates

on:
  push:
    branches:
      - codex/expertcheck-25.0-quality-leap
      - codex/expertcheck-25.1-runtime-integrity
  pull_request:
    paths:
      - "core25/**"
      - "tests/core25/**"
      - ".github/workflows/core25-quality.yml"

jobs:
  core25-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest "PyMuPDF>=1.24,<2" "openpyxl>=3.1,<4"

      - name: Run Core25 tests
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d core25 ]; then
            python -m pytest -q core25 --rootdir=.
          else
            echo "tests/core25 not created yet; harness ready"
          fi

  core20-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest "PyMuPDF>=1.24,<2" "openpyxl>=3.1,<4"

      - name: Run targeted Core20 regression
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q test_core20_*.py --rootdir=.

  alpha1-release-gate:
    needs:
      - core25-tests
      - core20-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full release-gate dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run mandatory focused regressions
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ../test_evidence_driven_requirements_100.py ../test_evidence_provenance_96.py ../test_core20_alpha1012_evidence_quality.py ../test_core20_alpha1013_proof_trace.py --rootdir=.

      # The repository contains historical tests from mutually incompatible
      # releases plus fixture-bound tests under /mnt/data. Keep the full legacy
      # suite visible as a diagnostic, but gate Alpha 1 on the active Core20
      # workflows, Core25 suite and focused current regressions above.
      - name: Run legacy full repository suite against baseline allowlist
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          (cd tests && python -m pytest -q --rootdir=.) 2>&1 | tee /tmp/legacy-pytest.log
          code_tests=${PIPESTATUS[0]}
          python -m pytest -q test_*.py --rootdir=. 2>&1 | tee -a /tmp/legacy-pytest.log
          code_root=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          from pathlib import Path
          from core25.release_gate import classify_failed_nodeids, failed_nodeids_from_pytest_output

          output = Path("/tmp/legacy-pytest.log").read_text(encoding="utf-8", errors="replace")
          failures = failed_nodeids_from_pytest_output(output)
          classified = classify_failed_nodeids(failures)
          print("legacy diagnostic failures:", len(failures))
          print("fixture_bound:", len(classified["fixture_bound"]))
          print("obsolete:", len(classified["obsolete"]))
          print("baseline_existing:", len(classified["baseline_existing"]))
          print("blockers:", len(classified["blockers"]))
          if classified["blockers"]:
              print("Unclassified/current-contract failures:")
              for nodeid in classified["blockers"]:
                  print(" -", nodeid)
              raise SystemExit(1)
          PY

          echo "Raw pytest exit codes: tests=${code_tests}, root=${code_root}; all failures are classified against the stable baseline."

      - name: Compile Core25
        run: python -m compileall -q core25


  baseline-full-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stable Core20 baseline
        uses: actions/checkout@v4
        with:
          ref: 6afaf020f329f07bdbce6d0ea2c0e1238023aed6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full diagnostic dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt

      - name: Run baseline full repository suite
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          (cd tests && python -m pytest -q --rootdir=.)
          python -m pytest -q test_*.py --rootdir=.
