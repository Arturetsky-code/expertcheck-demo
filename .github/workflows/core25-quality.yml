name: Core25 Quality Leap gates

on:
  push:
    branches:
      - codex/expertcheck-25.0-quality-leap
  pull_request:
    paths:
      - "core25/**"
      - "tests/core25/**"
      - ".github/workflows/core25-quality.yml"

jobs:
  core25-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest "PyMuPDF>=1.24,<2" "openpyxl>=3.1,<4"

      - name: Run Core25 tests
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d core25 ]; then
            python -m pytest -q core25 --rootdir=.
          else
            echo "tests/core25 not created yet; harness ready"
          fi

  core20-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest "PyMuPDF>=1.24,<2" "openpyxl>=3.1,<4"

      - name: Run targeted Core20 regression
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q test_core20_*.py --rootdir=.
